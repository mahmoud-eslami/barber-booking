name: barber_booking
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^2.0.0
  get: ^4.6.1
  supabase: ^2.16.2
  ionicons: ^0.2.3
  auto_size_text: ^3.0.0
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  camera: ^0.12.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  google_sign_in: ^7.2.0
  extended_image: ^10.1.0
  cloud_firestore: ^6.10.0
  dartz: ^0.10.1
  intl: ^0.20.3
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/


  fonts:
    - family: bitter
      fonts:
        - asset: assets/fonts/Bitter-Regular.ttf
          style: normal

